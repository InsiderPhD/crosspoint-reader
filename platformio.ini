[platformio]
default_envs = default
extra_configs = platformio.local.ini

[crosspoint]
version = 1.7.3

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
# freeink-sdk device selection: one C3 binary carries both X3 and X4 board
# profiles, chosen at runtime by HalGPIO's I2C fingerprint via einkDisplay
# .setDisplayX3() (see lib/hal/HalDisplay.cpp). Both profiles must be linked in.
  -DFREEINK_DEVICE_X3
  -DFREEINK_DEVICE_X4
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
# NimBLE (BLE page turner) is client-only with a single remote: disable the
# unused peripheral/broadcaster roles and cap connections/bonds at 1 to keep
# the host's RAM footprint minimal. Heap is the binding constraint — with the
# BLE stack up, the EPUB inflate reader must still find a ~32KB contiguous block.
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=1
# HID reports are tiny (<=10 bytes): shrink the ATT MTU (default 255) and the
# mbuf pool (default 12 blocks) to cut the host's steady-state heap use. Keep
# enough mbufs that scan-time advertisement bursts aren't dropped.
  -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=64
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=8
  ; Allow HTTPS connections without CA validation (self-signed / invalid certs).
  ; Required so esp-tls accepts client configs that intentionally skip
  ; server verification for KOReader sync endpoints.
  -DCONFIG_ESP_TLS_INSECURE=1
  -DCONFIG_ESP_TLS_SKIP_SERVER_CERT_VERIFY=1
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_pngdec.py


; Libraries
; SDK: freeink-sdk (Free-Ink/freeink-sdk), an MIT re-architecture of the former
; open-x4-epaper/community-sdk. The EInkDisplay/InputManager/BatteryMonitor/
; SDCardManager include paths and class names are preserved by a compat shim, so
; firmware source is unchanged. New required dep: BoardConfig (device profiles;
; the display/battery libs read geometry, pins and waveforms from it). Device is
; selected via the -DFREEINK_DEVICE_* flags in [base] build_flags below.
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ ^1.0.0
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
# NimBLE-Arduino is VENDORED in lib/NimBLE-Arduino (v2.3.6) with RAM patches
# (halved mbuf pools, 4KB host stack, trimmed controller config — search
# "CrossPoint (vendored patch)"). CONFIG_BT_NIMBLE_* -D flags don't work: the
# framework's sdkconfig.h hard-defines them and overrides the command line.

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes current branch)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"v${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"v${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"v${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG