[platformio]
default_envs = default
extra_configs = platformio.local.ini
# Cache compiled objects across builds/environments to speed up incremental builds.
build_cache_dir = .cache

[crosspoint]
version = 1.7.7

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
# freeink-sdk device selection: one C3 binary carries both X3 and X4 board
# profiles, chosen at runtime by HalGPIO's I2C fingerprint via einkDisplay
# .setDisplayX3() (see lib/hal/HalDisplay.cpp). Both profiles must be linked in.
  -DFREEINK_DEVICE_X3
  -DFREEINK_DEVICE_X4
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
# NimBLE (BLE page turner) is client-only with a single remote: disable the
# unused peripheral/broadcaster roles and cap connections/bonds at 1 to keep
# the host's RAM footprint minimal. Heap is the binding constraint — with the
# BLE stack up, the EPUB inflate reader must still find a ~32KB contiguous block.
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=1
# HID reports are tiny (<=10 bytes): shrink the ATT MTU (default 255) and the
# mbuf pool (default 12 blocks) to cut the host's steady-state heap use. Keep
# enough mbufs that scan-time advertisement bursts aren't dropped.
  -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=64
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=8
# wolfSSL TLS via freeink-sdk SecureNet (SecureClient/SecureHttpClient).
# Replaces the precompiled mbedTLS transport whose handshake needs two ~16.7KB
# CONTIGUOUS record buffers plus a P-256 bignum spike (the X3 sync OOM).
# SecureClient pins the TLS 1.3 key_share to X25519 (fixed 32-byte field math,
# no bignum temporaries) — HAVE_CURVE25519 is load-bearing for that.
# WOLFSSL_SP_RISCV32 selects the single-precision RISC-V math backend.
# scripts/patch_wolfssl.py (pre-build) adjusts Arduino-wolfSSL's
# user_settings.h (re-enables DH/FFDHE_2048, caps FP_MAX_BITS at 16384).
  -DFREEINK_NET_WOLFSSL=1
; Content protection: decrypt-on-read for protected EPUBs.
;
; Only the READ half of the ContentProtection Crypto interface is compiled in
; (rsaPrivateRaw / aes128CbcDecrypt / sha1 / sha256). Account activation --
; RSA keypair generation, RSAES-PKCS1-v1_5 encrypt and the PKCS#12 signing
; bundle -- runs in the user's browser via WebCrypto, so the device never
; links it. That is why WOLFSSL_KEY_GEN and WC_RC2 are deliberately absent:
; they exist only for that client half, and each pulls extra wolfSSL code into
; flash for a path this firmware no longer has.
  -DFREEINK_CONTENT_WOLFSSL=1
; Force software RSA. The Espressif wolfSSL port hardcodes ESP_HW_RSAMAX_BIT at
; 4096 while the ESP32-C3 MPI peripheral only handles operands up to 3072-bit,
; and it returns MP_EXPTMOD_E (-112) rather than falling back. The read path's
; content-key unwrap is a single RSA-1024 private op per book open, so the
; software path's speed costs nothing measurable and avoids the cliff entirely.
  -DNO_WOLFSSL_ESP32_CRYPT_RSA_PRI
  -DWOLFSSL_USER_SETTINGS
  -DWOLFSSL_OPTIONS_H
  -DWOLFSSL_CLIENT_EXAMPLE
  -DWOLFSSL_TLS13
  -DWOLFSSL_SP_RISCV32
  -DHAVE_TLS_EXTENSIONS
  -DHAVE_SUPPORTED_CURVES
  -DHAVE_HKDF
  -DHAVE_FFDHE_2048
  -DHAVE_CURVE25519
  -DWC_RSA_PSS
  -DHAVE_SNI
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/patch_wolfssl.py
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_pngdec.py


; Libraries
; SDK: freeink-sdk (Free-Ink/freeink-sdk), an MIT re-architecture of the former
; open-x4-epaper/community-sdk. The EInkDisplay/InputManager/BatteryMonitor/
; SDCardManager include paths and class names are preserved by a compat shim, so
; firmware source is unchanged. New required dep: BoardConfig (device profiles;
; the display/battery libs read geometry, pins and waveforms from it). Device is
; selected via the -DFREEINK_DEVICE_* flags in [base] build_flags below.
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
# Resolves the per-batch panel controller at boot: Xteink units ship either an
# SSD1677 or an UltraChip UC81xx sibling behind the same pinout, and driving the
# wrong command set leaves the panel silent (BUSY never asserts, nothing renders).
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
# PWM frontlight (X4 Pro warm/cool pair); inert on boards without one.
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
# Deep-sleep rail shutdown (powerDownRailsForSleep): cuts the X4 Pro's gated
# GT911/SD rails before esp_deep_sleep_start; inert on boards without gated rails.
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  SecureNet=symlink://freeink-sdk/libs/network/SecureNet
# Decrypt-on-read for protected EPUBs. Storage-agnostic core; lib/Epub/
# ContentProtection.cpp binds it to HalStorage. Books stay encrypted at rest --
# entries are decoded in memory, streamed in chunks, and never written back.
  ContentProtection=symlink://freeink-sdk/libs/book/ContentProtection
  wolfssl/Arduino-wolfSSL @ 5.7.2
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3
# NimBLE-Arduino is VENDORED in lib/NimBLE-Arduino (v2.3.6) with RAM patches
# (halved mbuf pools, 4KB host stack, trimmed controller config — search
# "CrossPoint (vendored patch)"). CONFIG_BT_NIMBLE_* -D flags don't work: the
# framework's sdkconfig.h hard-defines them and overrides the command line.


[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes current branch)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"v${crosspoint.version}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"v${crosspoint.version}-rc+${sysenv.CROSSPOINT_RC_HASH}\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  -DCROSSPOINT_VERSION=\"v${crosspoint.version}-slim\"
  ; serial output is disabled in slim builds to save space
  -UENABLE_SERIAL_LOG


; --- Xteink X4 Pro ------------------------------------------------------------
; SEPARATE BINARY, not an addition to the C3 image. The X4 Pro is an ESP32-S3
; (16MB flash / 8MB PSRAM) with a GT911 digitizer, a capacitive home pad, native
; SDMMC and its own display pinout. freeink-sdk's BoardConfig.h hard-errors if
; devices from two MCU families are selected at once ("Build one binary per
; family"), so this env UNSETS the C3 device flags rather than adding to them.
;
; [base] carries two other C3-specific settings that must not reach an Xtensa
; target: -DWOLFSSL_SP_RISCV32 (RISC-V single-precision math backend) and the
; esp32-c3-devkitm-1 board. Both are overridden below. Unflagging here, rather
; than restructuring [base], keeps the shipping X3/X4 envs bit-for-bit unchanged.
[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
build_unflags =
  ${base.build_unflags}
  -DFREEINK_DEVICE_X3
  -DFREEINK_DEVICE_X4
  -DWOLFSSL_SP_RISCV32
build_flags =
  ${base.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  -DBOARD_HAS_PSRAM
; scripts/git_branch.py only injects CROSSPOINT_VERSION for [env:default], so
; every other env sets it explicitly.
  -DCROSSPOINT_VERSION=\"v${crosspoint.version}-x4pro\"
; SD on this board is native SDMMC (the slot is silent to SPI-mode CMD0), which
; the SDK reaches through its block-device interface.
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; debug logging while the port is being brought up